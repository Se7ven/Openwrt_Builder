name: Imagebuilder gl-mt5000

on:
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Select build environment'
        required: true
        default: 'immortalwrt_master'
        type: choice
        options:
          - immortalwrt_master
          - immortalwrt_stable
          - openwrt_main
          - openwrt_stable
          - all

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        config: ${{ inputs.target_env == 'immortalwrt_master' && fromJSON('[{"target_env":"immortalwrt_master","sdk_repo":"immortalwrt","sdk_branch":"main","build_dir":"immortalwrt_master","tag_prefix":"immortalwrt-master"}]') || inputs.target_env == 'immortalwrt_stable' && fromJSON('[{"target_env":"immortalwrt_stable","sdk_repo":"immortalwrt","sdk_branch":"stable","build_dir":"immortalwrt_stable","tag_prefix":"immortalwrt-stable"}]') || inputs.target_env == 'openwrt_main' && fromJSON('[{"target_env":"openwrt_main","sdk_repo":"openwrt","sdk_branch":"main","build_dir":"openwrt_main","tag_prefix":"openwrt-main"}]') || inputs.target_env == 'openwrt_stable' && fromJSON('[{"target_env":"openwrt_stable","sdk_repo":"openwrt","sdk_branch":"stable","build_dir":"openwrt_stable","tag_prefix":"openwrt-stable"}]') || fromJSON('[{"target_env":"immortalwrt_master","sdk_repo":"immortalwrt","sdk_branch":"main","build_dir":"immortalwrt_master","tag_prefix":"immortalwrt-master"},{"target_env":"immortalwrt_stable","sdk_repo":"immortalwrt","sdk_branch":"stable","build_dir":"immortalwrt_stable","tag_prefix":"immortalwrt-stable"},{"target_env":"openwrt_main","sdk_repo":"openwrt","sdk_branch":"main","build_dir":"openwrt_main","tag_prefix":"openwrt-main"},{"target_env":"openwrt_stable","sdk_repo":"openwrt","sdk_branch":"stable","build_dir":"openwrt_stable","tag_prefix":"openwrt-stable"}]') }}

    env:
      INPUT_SDK_REPO: ${{ matrix.config.sdk_repo }}
      INPUT_SDK_BRANCH: ${{ matrix.config.sdk_branch }}
      BUILD_DIR: ${{ matrix.config.build_dir }}
      TAG_PREFIX: ${{ matrix.config.tag_prefix }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Clone Sources
        run: |
          bash ./sh/clone.sh

      - name: Prepare & Force Target
        run: |
          bash ./sh/prepare.sh

      - name: Start Compilation
        run: |
          cd ${{ env.BUILD_DIR }}
          export TERM=dumb
          export DEBIAN_FRONTEND=noninteractive
          NPROC=$(nproc)
          
          echo "===> Downloading packages..."
          set -o pipefail
          make download -j8 V=s 2>&1 | grep --line-buffered -E "^(make\[|\*\*\*|Checking|Downloading)"
          
          echo "===> Starting build process..."
          make world -j"$NPROC" || make world -j1 V=s

      - name: Rename Firmware Images
        run: |
          bash ./sh/finalize.sh "${{ env.BUILD_DIR }}"

      - name: Upload Firmware Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gl-mt5000-firmware-${{ matrix.config.target_env }}
          path: ${{ env.BUILD_DIR }}/bin/targets/mediatek/filogic/*-gl-mt5000-*

      - name: Create Release & Upload Firmware to Repository
        uses: softprops/action-gh-release@v2
        with:
          tag_name: Firmware-${{ matrix.config.target_env }}-${{ github.run_number }}
          name: "Auto-Build: ${{ matrix.config.target_env }} - GL-MT5000"
          body: "Automatically generated patch-build firmware for GL.iNet GL-MT5000 (${{ matrix.config.target_env }})."
          files: ${{ env.BUILD_DIR }}/bin/targets/mediatek/filogic/*-gl-mt5000-*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
