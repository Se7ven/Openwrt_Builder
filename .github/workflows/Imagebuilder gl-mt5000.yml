- name: Clone Sources
        env:
          INPUT_SDK_REPO: ${{ inputs.sdk_repo }}
          INPUT_SDK_BRANCH: ${{ inputs.sdk_branch }}
        run: |
          bash ./sh/clone.sh

      - name: Prepare & Force Target
        env:
          INPUT_SDK_REPO: ${{ inputs.sdk_repo }}
        run: |
          bash ./sh/prepare.sh

      - name: Start Compilation
        run: |
          cd openwrt
          make defconfig
          make -j$(nproc)

      - name: Rename Firmware Images
        env:
          INPUT_SDK_REPO: ${{ inputs.sdk_repo }}
          INPUT_SDK_BRANCH: ${{ inputs.sdk_branch }}
        run: |
          bash ./sh/finalize.sh
