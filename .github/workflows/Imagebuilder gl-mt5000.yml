name: Imagebuilder gl-mt5000

on:
  workflow_dispatch:
    inputs:
      sdk_repo:
        description: 'Distribution wählen'
        required: true
        default: 'immortalwrt'
        type: choice
        options:
          - immortalwrt
          - openwrt
      sdk_branch:
        description: 'Branch / Version wählen'
        required: true
        default: 'main'
        type: choice
        options:
          - main
          - stable

# WICHTIG: Erlaubnis für GitHub Actions, Releases im Repository zu erstellen
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Clone Sources
        env:
          INPUT_SDK_REPO: ${{ inputs.sdk_repo }}
          INPUT_SDK_BRANCH: ${{ inputs.sdk_branch }}
        run: |
          bash ./sh/clone.sh

      - name: Prepare & Force Target
        env:
          INPUT_SDK_REPO: ${{ inputs.sdk_repo }}
        run: |
          bash ./sh/prepare.sh

      - name: Start Compilation
        run: |
          cd openwrt
          export TERM=dumb
          export DEBIAN_FRONTEND=noninteractive
          NPROC=$(nproc)
          
          # 1. Download mit sichtbaren Lebenszeichen
          echo "===> Downloading packages..."
          set -o pipefail
          make download -j8 V=s 2>&1 | grep --line-buffered -E "^(make\[|\*\*\*|Checking|Downloading)"
          
          # 2. Build leise durchziehen, volle Ausgabe nur bei Fehlern
          echo "===> Starting build process..."
          make world -j"$NPROC" || make world -j1 V=s
         
      - name: Rename Firmware Images
        env:
          INPUT_SDK_REPO: ${{ inputs.sdk_repo }}
          INPUT_SDK_BRANCH: ${{ inputs.sdk_branch }}
        run: |
          bash ./sh/finalize.sh

      # Behält das alte Artifact-System als Backup (optional, tut aber nicht weh)
      - name: Upload Firmware Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gl-mt5000-firmware-${{ inputs.sdk_repo }}-${{ inputs.sdk_branch }}
          path: openwrt/bin/targets/mediatek/filogic/*-gl-mt5000-*

      # NEU: Erstellt offizielles GitHub Release und lädt die Dateien direkt ins Repo
      - name: Create Release & Upload Firmware to Repository
        uses: softprops/action-gh-release@v2
        with:
          tag_name: Firmware-${{ inputs.sdk_repo }}-${{ inputs.sdk_branch }}-${{ github.run_number }}
          name: "Auto-Build: ${{ inputs.sdk_repo }} (${{ inputs.sdk_branch }}) - GL-MT5000"
          body: "Automatisch generierte Firmware für den GL.iNet GL-MT5000 (Build-Nummer: ${{ github.run_number }})."
          files: openwrt/bin/targets/mediatek/filogic/*-gl-mt5000-*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
