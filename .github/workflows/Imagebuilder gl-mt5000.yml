name: Imagebuilder gl-mt5000

on:
  workflow_dispatch:
    inputs:
      sdk_repo:
        description: 'Distribution wählen'
        required: true
        default: 'immortalwrt'
        type: choice
        options:
          - immortalwrt
          - openwrt
      sdk_branch:
        description: 'Branch / Version wählen'
        required: true
        default: 'main'
        type: choice
        options:
          - main
          - stable

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    
    # Erzeugt dynamisch genau deine 4 Ordnernamen:
    # z.B. openwrt_main, openwrt_stable, immortalwrt_main, immortalwrt_stable
    env:
      INPUT_SDK_REPO: ${{ inputs.sdk_repo }}
      INPUT_SDK_BRANCH: ${{ inputs.sdk_branch }}
      BUILD_DIR: "${{ inputs.sdk_repo }}_${{ inputs.sdk_branch }}"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Clone Sources
        run: |
          bash ./sh/clone.sh

      - name: Prepare & Force Target
        run: |
          bash ./sh/prepare.sh

      - name: Start Compilation
        run: |
          cd ${{ env.BUILD_DIR }}
          export TERM=dumb
          export DEBIAN_FRONTEND=noninteractive
          NPROC=$(nproc)
          
          echo "===> Downloading packages..."
          set -o pipefail
          make download -j8 V=s 2>&1 | grep --line-buffered -E "^(make\[|\*\*\*|Checking|Downloading)"
          
          echo "===> Starting build process..."
          make world -j"$NPROC" || make world -j1 V=s
         
      - name: Rename Firmware Images
        run: |
          bash ./sh/finalize.sh

      - name: Upload Firmware Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gl-mt5000-firmware-${{ inputs.sdk_repo }}-${{ inputs.sdk_branch }}
          path: ${{ env.BUILD_DIR }}/bin/targets/mediatek/filogic/*-gl-mt5000-*

      - name: Create Release & Upload Firmware to Repository
        uses: softprops/action-gh-release@v2
        with:
          tag_name: Firmware-${{ inputs.sdk_repo }}-${{ inputs.sdk_branch }}-${{ github.run_number }}
          name: "Auto-Build: ${{ inputs.sdk_repo }} (${{ inputs.sdk_branch }}) - GL-MT5000"
          body: "Automatisch generierte Firmware für den GL.iNet GL-MT5000 (${{ inputs.sdk_repo }} - ${{ inputs.sdk_branch }})."
          files: ${{ env.BUILD_DIR }}/bin/targets/mediatek/filogic/*-gl-mt5000-*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
