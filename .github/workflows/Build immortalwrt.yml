name: Build immortalwrt

on:
  workflow_dispatch:
    inputs:
      docker:
        description: 'Docker einbinden'
        required: false
        default: 'false'
      tag2:
        description: 'ImmortalWrt Version/Tag'
        required: false
        default: 'master'

permissions:
  contents: write

env:
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE_DOCKER: ./config/docker.config
  DIY_P1_SH: ./sh/scripts-part1.sh
  DIY_P2_SH: ./sh/scripts-part2.sh
  DEFAULT_SETTING: ./default-settings-m0eak
  UPLOAD_BIN_DIR: true
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Europe/Berlin
  GOTOOLCHAIN: auto

jobs:
  build:
    name: Kompiliere GL-MT5000 Master
    runs-on: ubuntu-22.04

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Speicherplatz freigeben
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force

      - name: Build-Umgebung initialisieren
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get update
          sudo -E apt-get -y install dos2unix libfuse-dev
          sudo bash -c 'bash <(curl -s https://build-scripts.immortalwrt.org/init_build_environment.sh)'
          sudo timedatectl set-timezone "$TZ"
          sudo mkdir -p /workdir
          sudo chown $USER:$GROUPS /workdir
          echo "WORKFLOW_NAME=gl-mt5000_immortalwrt" >> $GITHUB_ENV
          INPUT_TAG2="${{ github.event.inputs.tag2 }}"
          [ -z "$INPUT_TAG2" ] && INPUT_TAG2="master"
          echo "TAG2=$INPUT_TAG2" | tr ' ' '_' >> $GITHUB_ENV

      - name: Quellcode klonen
        working-directory: /workdir
        run: |
          git clone --depth 1 -b mt5000 https://github.com/GLiNet-Tech/openwrt.git openwrt
          ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

      - name: Feeds konfigurieren und DIY 1 ausführen
        run: |
          cd openwrt
          echo "src-git packages https://github.com/immortalwrt/packages.git;master" > feeds.conf.default
          echo "src-git luci https://github.com/immortalwrt/luci.git;master" >> feeds.conf.default
          echo "src-git routing https://github.com/openwrt/routing.git;master" >> feeds.conf.default
          echo "src-git telephony https://github.com/openwrt/telephony.git;master" >> feeds.conf.default
          echo "src-git footstrap https://github.com/VizzleTF/luci-theme-footstrap.git" >> feeds.conf.default
          [ -f $GITHUB_WORKSPACE/$DIY_P1_SH ] && chmod +x $GITHUB_WORKSPACE/$DIY_P1_SH && $GITHUB_WORKSPACE/$DIY_P1_SH || true
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Konfiguration anwenden und DIY 2 ausführen
        run: |
          [ -e "$DEFAULT_SETTING" ] && mv "$DEFAULT_SETTING" openwrt/package/default-settings-m0eak || true
          [ -e files ] && mv ./files openwrt/files || true
          [ -e ./config/immortalwrt.config ] && cp ./config/immortalwrt.config openwrt/.config || true
          if [ "${{ github.event.inputs.docker }}" = "true" ] && [ -e $CONFIG_FILE_DOCKER ]; then
            cat $CONFIG_FILE_DOCKER >> openwrt/.config
          fi
          [ -f $DIY_P2_SH ] && chmod +x $DIY_P2_SH
          cd openwrt
          [ -f $GITHUB_WORKSPACE/$DIY_P2_SH ] && $GITHUB_WORKSPACE/$DIY_P2_SH || true

          # Vorhandene Devices deaktivieren und MT5000 erzwingen
          sed -i '/CONFIG_TARGET_DEVICE_/d' .config 2>/dev/null || true
          echo "CONFIG_TARGET_mediatek=y" >> .config
          echo "CONFIG_TARGET_mediatek_filogic=y" >> .config
          echo "CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_glinet_gl-mt5000=y" >> .config
          echo "CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_gl-mt5000=y" >> .config
          make defconfig
          echo "=== Überprüfe gewähltes Target-Gerät ==="
          grep "CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_" .config || true

      - name: Paketquellen herunterladen
        run: |
          cd openwrt
          make download -j8
          find dl -size -1024c -exec rm -f {} \;

      - name: Firmware kompilieren
        id: compile
        run: |
          cd openwrt
          echo "$(nproc) Thread(s) beim Kompilieren"
          yes "" | make -j$(nproc) target/linux/compile || make -j1 V=s target/linux/compile
          make -j$(nproc) target/linux/install PROFILE=glinet_gl-mt5000 || make -j$(nproc) target/linux/install PROFILE=gl-mt5000 || make -j$(nproc)
          echo "compile=success" >> $GITHUB_OUTPUT
          echo "device-name=gl-mt5000" >> $GITHUB_OUTPUT
          echo "file-date=$(date +"%Y%m%d%H%M")" >> $GITHUB_OUTPUT

      - name: bin-Verzeichnis als Artefakt hochladen
        uses: actions/upload-artifact@v4
        if: steps.compile.outputs.compile == 'success' && env.UPLOAD_BIN_DIR == 'true'
        with:
          name: ImmortalWrt_bin_${{ steps.compile.outputs.device-name }}-${{ steps.compile.outputs.file-date }}
          path: openwrt/bin

      - name: Release erstellen
        uses: softprops/action-gh-release@v2
        if: steps.compile.outputs.compile == 'success' && !cancelled()
        with:
          name: ImmortalWrt Brume 3 (GL-MT5000) Master ${{ steps.compile.outputs.file-date }}
          tag_name: ImmortalWrt_GL-MT5000_master_${{ steps.compile.outputs.file-date }}
          body: ImmortalWrt Master Feeds auf nativem GL-MT5000 Quellbaum.
          files: |
            openwrt/bin/targets/*/*/*sysupgrade*
            openwrt/bin/targets/*/*/*factory*
            openwrt/bin/targets/*/*/*manifest*
            openwrt/bin/targets/*/*/*sha256sums
            
