name: Build GL-MT5000 (OpenWrt source base)

on:
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Select build environment'
        required: true
        default: 'immortalwrt_master'
        type: choice
        options:
          - immortalwrt_master
          - immortalwrt_stable
          - openwrt_main
          - openwrt_stable
          - all
      sdk_tag:
        description: 'Optional release tag for frozen builds (e.g. v25.12.5). When set with a *_stable env, builds from a frozen release tag for maximum package runtime compatibility.'
        required: false
        default: ''
        type: string

permissions:
  contents: write

