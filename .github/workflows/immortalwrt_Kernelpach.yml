name: ImmortalWrt KernelPatch Builder

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      ssh:
        description: 'SSH connection to Actions'
        required: false
        default: 'false'

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Initialization Environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo -E apt-get -y update
        sudo -E apt-get -y install $(cat << 'EOF'
        libncurses5-dev libncursesw5-dev zlib1g-dev gawk
        flex patch gettext zlib1g-dev libc6-dev libssl-dev subversion
        git unzip sharutils subversion libxml-parser-perl ocaml-nox
        asciidoc libz-dev xsltproc libjson-perl libelf-dev libgmp-dev
        liblzma-dev rsync cpio wget python3 python3-pip swig time
        libfile-slurp-perl rsync g++ libtool autoconf automake autopoint
        uuid-dev libncurses-dev gettext libtool-bin cmake gperf upx-ucl
        EOF
        )
        sudo -E apt-get -y autoremove --purge
        sudo -E apt-get clean

    - name: Clone Source Code
      run: |
        git clone --depth 1 https://github.com/immortalwrt/immortalwrt.git openwrt
        mkdir -p openwrt/custom_files
        # Sauberer relativer Kopiervorgang statt fehlerhaftem absolutem Symlink
        [ -d "custom_files" ] && cp -rf custom_files/* openwrt/custom_files/ || true

    - name: Load Custom Feeds (Part 1.1)
      run: |
        cd openwrt
        [ -f ../sh/scripts-part1.1.sh ] && chmod +x ../sh/scripts-part1.1.sh && ../sh/scripts-part1.1.sh

    - name: Update Feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a

    - name: Install Feeds
      run: |
        cd openwrt
        ./scripts/feeds install -a

    - name: Load Custom Configuration & Scripts (Part 2.1)
      run: |
        cd openwrt
        # Kopiere deine immortalwrt.conf als Basis-Config
        [ -f ../config/immortalwrt.conf ] && cp -f ../config/immortalwrt.conf .config
        
        # Führe dein Part 2.1 Skript aus (kopiert Patches und Board-Definitionen)
        [ -f ../sh/scripts-part2.1.sh ] && chmod +x ../sh/scripts-part2.1.sh && ../sh/scripts-part2.1.sh
        
        make defconfig

    - name: Compile Firmware
      run: |
        cd openwrt
        make -j$(nproc) || make -j1 V=s

    - name: Organize Files
      id: organize
      if: (!cancelled())
      run: |
        cd openwrt
        rm -rf bin/targets/*/*/packages
        echo "FIRMWARE=$PWD/bin/targets" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_ENV

    - name: Upload Firmware to Artifacts
      uses: actions/upload-artifact@v4
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: ImmortalWrt_MT5000_Firmware
        path: ${{ env.FIRMWARE }}
