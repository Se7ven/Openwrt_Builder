name: ImmortalWrt KernelPatch Builder

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      branch:
        description: 'ImmortalWrt Branch / Tag (z.B. openwrt-25.12 oder main)'
        required: true
        default: 'openwrt-25.12'
      ssh:
        description: 'SSH connection to Actions'
        required: false
        default: 'false'

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Initialization Environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo -E apt-get -y update
        sudo -E apt-get -y install $(cat << 'EOF'
        libncurses5-dev libncursesw5-dev zlib1g-dev gawk
        flex patch gettext zlib1g-dev libc6-dev libssl-dev subversion
        git unzip sharutils subversion libxml-parser-perl ocaml-nox
        asciidoc libz-dev xsltproc libjson-perl libelf-dev libgmp-dev
        liblzma-dev rsync cpio wget python3 python3-pip swig time
        libfile-slurp-perl rsync g++ libtool autoconf automake autopoint
        uuid-dev libncurses-dev gettext libtool-bin cmake gperf upx-ucl
        EOF
        )
        sudo -E apt-get -y autoremove --purge
        sudo -E apt-get clean

    - name: Clone Source Code
      run: |
        BRANCH="${{ github.event.inputs.branch }}"
        if [ -z "$BRANCH" ]; then
          BRANCH="openwrt-25.12"
        fi
        
        if [ "$BRANCH" = "main" ]; then
          echo "===> Ziehe den Standard-Zweig ohne Branch-Angabe (führt zu Kernel 6.18.x)"
          git clone --depth 1 https://github.com/immortalwrt/immortalwrt.git openwrt
        else
          echo "===> Ziehe explizit den Branch: $BRANCH (führt zu Kernel 6.12)"
          git clone --branch "$BRANCH" --depth 1 https://github.com/immortalwrt/immortalwrt.git openwrt
        fi
        
        echo "===> Setze Symlink für custom_files"
        ln -s /home/runner/work/Openwrt_Builder/Openwrt_Builder /home/runner/work/Openwrt_Builder/openwrt/custom_files || true

    - name: Load Custom Feeds (Part 1.1)
      run: |
        cd openwrt
        [ -f ../sh/scripts-part1.1.sh ] && chmod +x ../sh/scripts-part1.1.sh && ../sh/scripts-part1.1.sh

    - name: Update Feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a

    - name: Install Feeds
      run: |
        cd openwrt
        ./scripts/feeds install -a

    - name: Load Custom Configuration & Scripts (Part 2.1)
      run: |
        cd openwrt
        [ -f ../config/immortalwrt.conf ] && cp -f ../config/immortalwrt.conf .config
        
        # Übergeben des aktuellen Branches als Umgebungsvariable für bedingte Patches
        export BUILD_BRANCH="${{ github.event.inputs.branch }}"
        
        [ -f ../sh/scripts-part2.1.sh ] && chmod +x ../sh/scripts-part2.1.sh && ../sh/scripts-part2.1.sh
        make defconfig

    - name: Compile Firmware
      id: compile
      run: |
        cd openwrt
        make -j$(nproc) || make -j1 V=s
        
        # Setze die Variablen für nachfolgende Schritte
        echo "compile=success" >> $GITHUB_OUTPUT
        echo "file-date=$(date +'\%Y.\%m.\%d')" >> $GITHUB_OUTPUT
        echo "device-name=gl-mt5000" >> $GITHUB_OUTPUT

    - name: bin-Verzeichnis als Artefakt hochladen
      uses: actions/upload-artifact@v4
      if: steps.compile.outputs.compile == 'success'
      with:
        name: ImmortalWrt_bin_${{ steps.compile.outputs.device-name }}-${{ steps.compile.outputs.file-date }}
        path: openwrt/bin

    - name: Release erstellen
      uses: softprops/action-gh-release@v2
      if: steps.compile.outputs.compile == 'success' && !cancelled()
      with:
        name: ImmortalWrt Brume 3 (GL-MT5000) ${{ github.event.inputs.branch }} (${{ steps.compile.outputs.file-date }})
        tag_name: gl-mt5000-${{ github.event.inputs.branch }}-${{ steps.compile.outputs.file-date }}-${{ github.run_number }}
        prerelease: true
        body: |
          Automatisierter ImmortalWrt Build für den GL-MT5000 (Brume 3).
          - Verwendeter Branch: `${{ github.event.inputs.branch }}`
          - Build-Datum: `${{ steps.compile.outputs.file-date }}`
          - GitHub Run: `#${{ github.run_number }}`
        files: |
          openwrt/bin/targets/*/*/*sysupgrade*
          openwrt/bin/targets/*/*/*factory*
          openwrt/bin/targets/*/*/*manifest*
          openwrt/bin/targets/*/*/*sha256sums
