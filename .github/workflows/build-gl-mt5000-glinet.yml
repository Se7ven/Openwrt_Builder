name: Build GL-MT5000 (GL-iNet source base)

on:
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Select the environment to build:'
        required: true
        default: 'immortalwrt_master'
        type: choice
        options:
          - immortalwrt_master
          - immortalwrt_stable
          - openwrt_main
          - openwrt_stable
          - all
      docker:
        description: 'Enable Docker configuration (optional)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  prepare-matrix:
    runs-on: ubuntu-26.04
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Define matrix
        id: set-matrix
        run: |
          ENV_CHOICE="${{ github.event.inputs.target_env }}"
          if [ "$ENV_CHOICE" = "all" ]; then
            echo 'matrix={"include":[' \
              '{"env_key":"immortalwrt_master", "sdk_repo":"immortalwrt", "sdk_branch":"main", "feed_branch":"master", "config":"./config/immortalwrt.config", "tag_prefix":"immortalwrt-master"},' \
              '{"env_key":"immortalwrt_stable", "sdk_repo":"immortalwrt", "sdk_branch":"openwrt-25.12", "feed_branch":"openwrt-25.12", "config":"./config/immortalwrt.config", "tag_prefix":"immortalwrt-25.12"},' \
              '{"env_key":"openwrt_main", "sdk_repo":"openwrt", "sdk_branch":"main", "feed_branch":"master", "config":"./config/mt5000.config", "tag_prefix":"openwrt-main"},' \
              '{"env_key":"openwrt_stable", "sdk_repo":"openwrt", "sdk_branch":"openwrt-25.12", "feed_branch":"openwrt-25.12", "config":"./config/mt5000.config", "tag_prefix":"openwrt-stable-25.12"}' \
              ']}' >> $GITHUB_OUTPUT
          else
            case "$ENV_CHOICE" in
              immortalwrt_master)
                echo 'matrix={"include":[{"env_key":"immortalwrt_master", "sdk_repo":"immortalwrt", "sdk_branch":"main", "feed_branch":"master", "config":"./config/immortalwrt.config", "tag_prefix":"immortalwrt-master"}]}' >> $GITHUB_OUTPUT
                ;;
              immortalwrt_stable)
                echo 'matrix={"include":[{"env_key":"immortalwrt_stable", "sdk_repo":"immortalwrt", "sdk_branch":"openwrt-25.12", "feed_branch":"openwrt-25.12", "config":"./config/immortalwrt.config", "tag_prefix":"immortalwrt-25.12"}]}' >> $GITHUB_OUTPUT
                ;;
              openwrt_main)
                echo 'matrix={"include":[{"env_key":"openwrt_main", "sdk_repo":"openwrt", "sdk_branch":"main", "feed_branch":"master", "config":"./config/mt5000.config", "tag_prefix":"openwrt-main"}]}' >> $GITHUB_OUTPUT
                ;;
              openwrt_stable)
                echo 'matrix={"include":[{"env_key":"openwrt_stable", "sdk_repo":"openwrt", "sdk_branch":"openwrt-25.12", "feed_branch":"openwrt-25.12", "config":"./config/mt5000.config", "tag_prefix":"openwrt-stable-25.12"}]}' >> $GITHUB_OUTPUT
                ;;
            esac
          fi

  build:
    name: ${{ inputs.target_env }}
    needs: prepare-matrix
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare-matrix.outputs.matrix) }}

    env:
      WORKFLOW_NAME: ${{ matrix.env_key }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free up disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Initialize build environment
        env:
          DEBIAN_FRONTEND: noninteractive
          TZ: Europe/Berlin
        run: |
          #sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt update
          #sudo -E apt-get -qq install -y dos2unix libfuse-dev build-essential libncurses5-dev gawk git libssl-dev gettext zlib1g-dev swig python3-distutils libelf-dev m4 flex bison
          sudo apt install -y libncurses6 libncurses-dev
          sudo timedatectl set-timezone "$TZ"
          sudo mkdir -p /workdir
          sudo chown $USER:$GROUPS /workdir

      - name: Step 1 - Clone official GL.iNet MT5000 source tree
        working-directory: /workdir
        run: |
          TARGET_DIR="${{ matrix.env_key }}"
          echo "===> Cloning GL.iNet MT5000 source tree (Branch: mt5000) to $TARGET_DIR"
          git clone --depth 1 -b mt5000 https://github.com/GLiNet-Tech/openwrt.git "$TARGET_DIR"
          ln -sf "/workdir/$TARGET_DIR" "$GITHUB_WORKSPACE/$TARGET_DIR"

      - name: Step 2 - Run feeds & scripts-part1.sh
        run: |
          TARGET_DIR="${{ matrix.env_key }}"
          cd "$TARGET_DIR"
          
          if [[ "${{ matrix.sdk_repo }}" == "immortalwrt" ]]; then
            echo "src-git packages https://github.com/immortalwrt/packages.git;${{ matrix.feed_branch }}" > feeds.conf.default
            echo "src-git luci https://github.com/immortalwrt/luci.git;${{ matrix.feed_branch }}" >> feeds.conf.default
            echo "src-git routing https://github.com/openwrt/routing.git;${{ matrix.feed_branch }}" >> feeds.conf.default
          else
            echo "src-git packages https://github.com/${{ matrix.sdk_repo }}/packages.git;${{ matrix.feed_branch }}" > feeds.conf.default
            echo "src-git luci https://github.com/${{ matrix.sdk_repo }}/luci.git;${{ matrix.feed_branch }}" >> feeds.conf.default
            echo "src-git routing https://github.com/openwrt/routing.git;${{ matrix.feed_branch }}" >> feeds.conf.default
            echo "src-git telephony https://github.com/${{ matrix.sdk_repo }}/telephony.git;${{ matrix.feed_branch }}" >> feeds.conf.default
          fi
          echo "src-git footstrap https://github.com/VizzleTF/luci-theme-footstrap.git" >> feeds.conf.default

          # Run scripts-part1.sh
          if [ -f "$GITHUB_WORKSPACE/sh/scripts-part1.sh" ]; then
            chmod +x "$GITHUB_WORKSPACE/sh/scripts-part1.sh"
            "$GITHUB_WORKSPACE/sh/scripts-part1.sh"
          fi
          
          ./scripts/feeds update -a || true
          ./scripts/feeds install -a

      - name: Step 3 - Run scripts-part2.sh (Custom Packages & Network)
        run: |
          TARGET_DIR="${{ matrix.env_key }}"
          cd "$TARGET_DIR"

          # Run scripts-part2.sh
          if [ -f "$GITHUB_WORKSPACE/sh/scripts-part2.sh" ]; then
            chmod +x "$GITHUB_WORKSPACE/sh/scripts-part2.sh"
            "$GITHUB_WORKSPACE/sh/scripts-part2.sh"
          fi

          # Apply config
          CONFIG_FILE="$GITHUB_WORKSPACE/${{ matrix.config }}"
          [ -f "$CONFIG_FILE" ] && cp "$CONFIG_FILE" .config

          make defconfig

      - name: Append optional Docker configuration
        if: ${{ github.event.inputs.docker == 'true' }}
        run: |
          TARGET_DIR="${{ matrix.env_key }}"
          cd "$TARGET_DIR"
          if [ "${{ matrix.sdk_repo }}" = "immortalwrt" ] && [ -f "$GITHUB_WORKSPACE/config/immortalwrt.config" ]; then
            cat "$GITHUB_WORKSPACE/config/immortalwrt.config" >> .config
          elif [ -f "$GITHUB_WORKSPACE/config/docker.config" ]; then
            cat "$GITHUB_WORKSPACE/config/docker.config" >> .config
          fi
          make defconfig

      - name: Download package sources (make download)
        run: |
          TARGET_DIR="${{ matrix.env_key }}"
          cd "$TARGET_DIR"
          make download -j8
          find dl -size -1024c -exec rm -f {} \;

      - name: Compile firmware
        id: compile
        run: |
          TARGET_DIR="${{ matrix.env_key }}"
          cd "$TARGET_DIR"
          echo "$(nproc) threads during compilation"
          make -j$(nproc) || make -j1 V=s
          echo "compile=success" >> $GITHUB_OUTPUT
          echo "file-date=$(date +"%Y%m%d%H%M")" >> $GITHUB_OUTPUT

      - name: Step 4 - Finalize & rename (finalize.sh)
        if: steps.compile.outputs.compile == 'success'
        run: |
          bash sh/finalize.sh "${{ matrix.env_key }}"

      - name: Create and upload release
        uses: softprops/action-gh-release@v2
        if: steps.compile.outputs.compile == 'success' && !cancelled()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: GL-MT5000_${{ matrix.tag_prefix }}_${{ steps.compile.outputs.file-date }}
          name: GL-MT5000 (${{ matrix.env_key }}) Build ${{ steps.compile.outputs.file-date }}
          body: Custom GL-MT5000 build based on original GL-iNet sources with Part1 and Part2 modifications (${{ matrix.env_key }}).
          files: |
            ${{ matrix.env_key }}/bin/targets/*/*/*sysupgrade*
            ${{ matrix.env_key }}/bin/targets/*/*/*factory*
            ${{ matrix.env_key }}/bin/targets/*/*/*manifest*
            ${{ matrix.env_key }}/bin/targets/*/*/*sha256sums
